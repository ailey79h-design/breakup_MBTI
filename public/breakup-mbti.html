        const SCORE_KEYS = ['E', 'I', 'R', 'S', 'H', 'L', 'C', 'A'];

        function encodeSharePayload(mbti, scores) {
            const s = {};
            for (const k of SCORE_KEYS) s[k] = Number(scores[k]) || 0;
            const json = JSON.stringify({ m: mbti, s });
            const bytes = new TextEncoder().encode(json);
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function decodeSharePayload(encoded) {
            try {
                if (!encoded || typeof encoded !== 'string') return null;
                let b64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
                const pad = b64.length % 4;
                if (pad) b64 += '='.repeat(4 - pad);
                const binary = atob(b64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const o = JSON.parse(new TextDecoder().decode(bytes));
                if (!o || typeof o.m !== 'string' || o.m.length !== 4 || !o.s || typeof o.s !== 'object') return null;
                const out = {};
                for (const k of SCORE_KEYS) {
                    const n = Number(o.s[k]);
                    if (Number.isNaN(n)) return null;
                    out[k] = n;
                }
                return { m: o.m.toUpperCase(), s: out };
            } catch (e) {
                return null;
            }
        }

        function tryOpenSharedFromUrl() {

            const data = decodeSharePayload(r.trim());
            if (!data) return false;
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('test-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('progress-wrapper').classList.add('hidden');
            displayResult(data.m, data.s, { fromShare: true });
            shareableDocId = null;
            return true;
        }

                            <div onclick="window.selectScore(${q.id}, 0, 'neutral')" class="scale-dot w-5 h-5 rounded-full" id="dot-${q.id}-n"></div>
                            <div onclick="window.selectScore(${q.id}, 2, 'minus')" class="scale-dot w-7 h-7 rounded-full" id="dot-${q.id}-m2"></div>
                            <div onclick="window.selectScore(${q.id}, 3, 'minus')" class="scale-dot w-9 h-9 rounded-full" id="dot-${q.id}-m3"></div>
                        </div>
                        <span class="text-slate-300 font-bold text-[11px]">전혀 아님</span>
                    </div>
                </div>
            `).join('');
        };

        window.selectScore = (qId, score, type) => {
            const suffixes = ['p3', 'p2', 'n', 'm2', 'm3'];
            suffixes.forEach(s => document.getElementById(`dot-${qId}-${s}`)?.classList.remove('active-plus', 'active-minus', 'active-neutral'));
            const targetId = type === 'plus' ? `dot-${qId}-p${score}` : (type === 'minus' ? `dot-${qId}-m${score}` : `dot-${qId}-n`);
            document.getElementById(targetId)?.classList.add(type === 'plus' ? 'active-plus' : (type === 'minus' ? 'active-minus' : 'active-neutral'));
            answers[qId] = type === 'plus' ? score : (type === 'minus' ? -score : 0);
            updateProgress();
        };

        const updateProgress = () => {
            const count = Object.keys(answers).length;
            const progress = Math.round((count / questions.length) * 100);
            const progressBar = document.getElementById('header-progress');
            const progressText = document.getElementById('progress-text');
            if (progressBar) progressBar.style.width = progress + '%';
            if (progressText) progressText.innerText = progress + '%';

            if (count === questions.length) {
                const btn = document.getElementById('submit-btn');
                if (btn) {
                    btn.classList.replace('bg-rose-100', 'btn-pink');
                    btn.classList.replace('text-rose-300', 'text-white');
                    btn.classList.remove('cursor-not-allowed');
                    btn.innerText = "결과 보러가기 ✨";
                }
            }
        };

        const calculateAndSave = async () => {
            if (Object.keys(answers).length < questions.length) return;
            document.getElementById('test-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            let s = { E: 0, I: 0, R: 0, S: 0, H: 0, L: 0, C: 0, A: 0 };
            questions.forEach(q => {
                const v = answers[q.id] || 0;
                const [l, r] = q.type.split('');
                if (v > 0) s[l] += v; else if (v < 0) s[r] += Math.abs(v); else { s[l] += 0.5; s[r] += 0.5; }
            });
            const mbti = (s.E >= s.I ? "E" : "I") + (s.R >= s.S ? "R" : "S") + (s.H >= s.L ? "H" : "L") + (s.C >= s.A ? "C" : "A");

            try {
                if (db && currentUser) {
                    const id = crypto.randomUUID();
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'results', id), {
                        mbti, scores: s, createdAt: new Date().toISOString(), userId: currentUser.uid
                    });
                    shareableDocId = id;
                }
            } catch (e) { console.error("Save error:", e); }
            setTimeout(() => displayResult(mbti, s), 1500);
        };

        const displayResult = (mbti, s, options = {}) => {
            const fromShare = !!options.fromShare;
            lastMbti = mbti;
            lastScores = { ...s };
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('progress-wrapper').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const data = typeData[mbti] || typeData["ERHC"];
            document.getElementById('result-mbti').innerText = mbti;
            document.getElementById('result-title').innerText = data.title;
            document.getElementById('result-desc').innerText = data.desc;
            document.getElementById('best-match').innerText = data.best;
            document.getElementById('worst-match').innerText = data.worst;

            const lines = emotionalLines[mbti];
            let emotionalPick = '';
            if (lines?.length) {
                emotionalPick = lines[Math.floor(Math.random() * lines.length)];
            }

            const roast = resultRoast[mbti];
            const roastWrap = document.getElementById('result-roast-wrap');
            if (roast) {
                document.getElementById('result-roast').innerText = roast.line;
                document.getElementById('result-sub').innerText = emotionalPick || roast.sub;
                roastWrap.classList.remove('hidden');
            } else {
                document.getElementById('result-roast').innerText = '';
                document.getElementById('result-sub').innerText = '';
                roastWrap.classList.add('hidden');
            }

            const theme = cardThemes[mbti];
            if (theme) {
                const card = document.getElementById('share-card');
                card.style.background = theme.bg;
                document.getElementById('card-emoji').innerText = theme.emoji;
                document.getElementById('card-tag').innerText = theme.tag;
            }

            document.getElementById('card-mbti').innerText = mbti;
            document.getElementById('card-title').innerText = data.title;
            if (roast) {
                document.getElementById('card-roast').innerText = roast.line;
            } else {
                document.getElementById('card-roast').innerText = '';
            }
            document.getElementById('card-emotion').innerText = emotionalPick;

            const tips = breakupTips[mbti];
            const tipsWrap = document.getElementById('result-tips-wrap');
            if (tips) {
                document.getElementById('tip-main').innerText = tips.tip;
                document.getElementById('tip-desc').innerText = tips.desc;
                tipsWrap.classList.remove('hidden');
            } else {
                document.getElementById('tip-main').innerText = '';
                document.getElementById('tip-desc').innerText = '';
                tipsWrap.classList.add('hidden');
            }

            const traits = [
                { l: 'E', r: 'I', label: '표현 방식', sl: '감정 발산', sr: '내면 침잠' },
                { l: 'R', r: 'S', label: '극복 방식', sl: '새로운 만남', sr: '혼자만의 시간' },
                { l: 'H', r: 'L', label: '미련 온도', sl: '뜨거운 집착', sr: '차가운 해탈' },
                { l: 'C', r: 'A', label: '종결 스타일', sl: '확실한 대화', sr: '조용한 회피' }
            ];

            document.getElementById('trait-dashboard').innerHTML = traits.map(t => {
                const total = (s[t.l] + s[t.r]) || 1;
                const lP = Math.round((s[t.l] / total) * 100);
                return `
                    <div class="space-y-1.5">
                        <div class="flex justify-between items-center px-1">
                            <span class="text-[9px] font-bold text-rose-300 uppercase">${t.sl}</span>
                            <span class="text-[10px] font-bold text-slate-400">${t.label}</span>
                            <span class="text-[9px] font-bold text-slate-300 uppercase">${t.sr}</span>
                        </div>
                        <div class="h-6 bg-white rounded-full flex overflow-hidden border border-rose-50 shadow-inner relative">
                            <div class="h-full bg-rose-200 transition-all duration-1000" style="width: ${lP}%"></div>
                            <div class="absolute inset-0 flex justify-between items-center px-3 pointer-events-none text-[10px] font-black">
                                <span class="text-rose-500">${lP}%</span>
                                <span class="text-slate-400">${100 - lP}%</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const owner = document.getElementById('result-owner-actions');
            const sharedFooter = document.getElementById('shared-take-test-footer');
            if (fromShare) {
                owner?.classList.add('hidden');
                sharedFooter?.classList.remove('hidden');
            } else {
                owner?.classList.remove('hidden');
                sharedFooter?.classList.add('hidden');
                prefetchKakaoSdkForShare();
            }
        };

        const bestMatchDesc = (targetData) => `
둘이 이별하면 이상하게 싸움이 길어지진 않음ㅋㅋ

한 명이 감정 올라가기 전에
다른 한 명이 적당히 빠져줘서
"어? 생각보다 깔끔하게 끝났네?" 이 느낌 남음

「${targetData.title}」은 ${targetData.desc}

👉 결론: 서로 덜 상처받고 끝나는 몇 안 되는 조합
`;

        const worstMatchDesc = (targetData) => `
이 조합은 이별하면 진짜 지옥 열림ㅋㅋ

한 명은 계속 붙잡고
한 명은 이미 마음 정리 끝나 있어서
대화 자체가 안 통함

"왜 저래?" vs "왜 아직 저러지?"
이 상태로 서로 더 상처만 줌

「${targetData.title}」은 ${targetData.desc}

👉 결론: 타이밍도, 감정도, 방식도 다 안 맞음
`;

        window.showTypeDetail = (mode) => {
            const currentMbti = document.getElementById('result-mbti').innerText;
            const currentData = typeData[currentMbti] || typeData.ERHC;
            const targetMbti = mode === 'best' ? currentData.best : currentData.worst;
            const targetData = typeData[targetMbti];

            if (!targetData) return;

            document.getElementById('modal-type-code').innerText = targetMbti;
            document.getElementById('modal-type-title').innerText = targetData.title;
            document.getElementById('modal-type-tag').innerText = mode === 'best' ? '❤️ 환상의 짝꿍인 이유' : '💣 파멸의 조합인 이유';
            let descText;
            if (mode === 'best') {
                descText = bestMatchDesc(targetData);
            } else {
                descText = worstMatchDesc(targetData);
            }
            document.getElementById('modal-type-desc').innerText = descText.trim();
            document.getElementById('type-modal').classList.add('active');
        };

        document.getElementById('start-btn').onclick = () => {
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('test-screen').classList.remove('hidden');
            document.getElementById('progress-wrapper').classList.remove('hidden');
            renderQuestions();
        };

        document.getElementById('save-image-btn').onclick = async () => {
            const h2c = window.html2canvas;
            if (!h2c) {
                showToastMessage('이미지 도구를 불러오는 중이에요. 잠시 후 다시 눌러줘');
                return;
            }
            const card = document.getElementById('share-card');
            try {
                const canvas = await h2c(card, {
                    scale: 2,
                    backgroundColor: null,
                    useCORS: true,
                });
                const link = document.createElement('a');
                link.download = 'breakup-mbti.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToastMessage('이미지 저장 완료! 📸');
            } catch (e) {
                console.warn('html2canvas', e);
                showToastMessage('저장에 실패했어. 다시 눌러줘');
            }
        };

        document.getElementById('retest-btn').onclick = () => location.reload();

        document.getElementById('shared-take-test-btn')?.addEventListener('click', () => {
            location.href = SHARE_PAGE_PATH;
        });

        document.getElementById('submit-btn').onclick = calculateAndSave;

        const copyToClipboard = (text) => {
            return new Promise((resolve, reject) => {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text)
                        .then(resolve)
                        .catch(() => {
                            useExecCommand(text) ? resolve() : reject();
                        });
                } else {
                    useExecCommand(text) ? resolve() : reject();
                }
            });
        };

        const useExecCommand = (text) => {
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.setAttribute('readonly', '');
                textArea.style.position = "fixed";
                textArea.style.left = "0";
                textArea.style.top = "0";
                textArea.style.opacity = "0";
                textArea.style.pointerEvents = "none";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                textArea.setSelectionRange(0, text.length);
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                return successful;
            } catch (err) {
                console.error('Fallback copy failed:', err);
                return false;
            }
        };

        /** null = 아직 안 받음, '' = 서버에 키 없음 */
        let kakaoJsKeyCache = null;

        async function fetchKakaoJsKey() {
            if (kakaoJsKeyCache !== null) return kakaoJsKeyCache;
            try {
                const res = await fetch('/api/kakao/config');
                if (!res.ok) {
                    kakaoJsKeyCache = '';
                    return '';
                }
                const data = await res.json();
                kakaoJsKeyCache = (data.key || '').trim();
                return kakaoJsKeyCache;
            } catch {
                kakaoJsKeyCache = '';
                return '';
            }
        }

        /** 결과 화면 진입 시 카카오 키·SDK 미리 로드 → 탭 한 번에 친구 선택까지 빨리 연결 */
        function prefetchKakaoSdkForShare() {
            fetchKakaoJsKey()
                .then((key) => {
                    if (!key) return null;
                    return loadKakaoSdk();
                })
                .then((Kakao) => {
                    if (!Kakao) return;
                    const key = kakaoJsKeyCache;
                    if (key && !Kakao.isInitialized()) Kakao.init(key);
                })
                .catch(() => {});
        }

        function loadKakaoSdk() {
            return new Promise((resolve, reject) => {
                if (window.Kakao) {
                    resolve(window.Kakao);
                    return;
                }
                const script = document.createElement('script');
                script.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js';
                script.crossOrigin = 'anonymous';
                script.onload = () => resolve(window.Kakao);
                script.onerror = () => reject(new Error('Kakao SDK load failed'));
                document.head.appendChild(script);
            });
        }

        /** 카카오톡 피드 공유 → 친구 선택 (카카오개발자 앱·도메인·KAKAO_JAVASCRIPT_KEY 필요) */
        async function tryShareWithKakao(shareUrl) {
            const key = await fetchKakaoJsKey();
            if (!key) return false;
            try {
                const Kakao = await loadKakaoSdk();
                if (!Kakao.isInitialized()) Kakao.init(key);
                const imageUrl = window.location.origin + '/og-image.jpg?v=3';
                await Kakao.Share.sendDefault({
                    objectType: 'feed',
                    content: {
                        title: KAKAO_FEED_TITLE,
                        description: KAKAO_FEED_DESCRIPTION,
                        imageUrl,
                        link: {
                            mobileWebUrl: shareUrl,
                            webUrl: shareUrl,
                        },
                    },
                    buttons: [
                        {
                            title: '결과 보러가기',
                            link: {
                                mobileWebUrl: shareUrl,
                                webUrl: shareUrl,
                            },
                        },
                    ],
                });
                return true;
            } catch (e) {
                console.warn('Kakao Share:', e);
                return false;
            }
        }

        document.getElementById('share-link-btn').onclick = async () => {
            if (!lastMbti || !lastScores) {
                showToastMessage('먼저 결과를 확인한 뒤 다시 눌러줘!');
                return;
            }
            const payload = encodeSharePayload(lastMbti, lastScores);
            const url = window.location.origin + SHARE_PAGE_PATH + '?r=' + encodeURIComponent(payload);
            const SHARE_CLIPBOARD_INTRO =
                SHARE_LINES[Math.floor(Math.random() * SHARE_LINES.length)];
            const shareText = `${SHARE_CLIPBOARD_INTRO} ${url}`;

            // ① 카카오 공식 피드 SDK → 친구 선택 (키·사이트 도메인 등록 필요)
            if (await tryShareWithKakao(url)) {
                showToastMessage('카카오톡에서 친구 골라서 보내봐 💌');
                return;
            }

            // ② 시스템 공유 시트에서 카카오톡 선택 (인앱 브라우저에서도 자주 동작)
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: '말랑 이별 MBTI 💔',
                        text: SHARE_CLIPBOARD_INTRO,
                        url,
                    });
                    showToastMessage('목록에서 카카오톡을 골라줘! 💬');
                    return;
                } catch (err) {
                    if (err && err.name === 'AbortError') return;
                    try {
                        await navigator.share({ url });
                        showToastMessage('카카오톡을 선택해서 보내줘! 💬');
                        return;
                    } catch (err2) {
                        if (err2 && err2.name === 'AbortError') return;
                    }
                }
            }

            // ③ 링크만 조용히 복사 (카카오 채팅에 길게 눌러 붙여넣기)
            try {
                await copyToClipboard(url);
                showToastMessage('링크를 복사했어! 카카오톡에 붙여넣기 해줘 📋');
            } catch {
                try {
                    await copyToClipboard(shareText);
                    showToastMessage('복사했어! 카카오톡에 붙여넣기 해줘 📋');
                } catch {
                    showToastMessage('브라우저 메뉴(⋮) → 공유에서 카카오톡을 골라줘');
                }
            }
        };

        const defaultCopyToastText = document.getElementById('toast').textContent.trim();

        const showToast = () => {
            showToastMessage(defaultCopyToastText);
        };

        function showToastMessage(msg) {
            const t = document.getElementById('toast');
            if (t) {
                t.textContent = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 2500);
            }
        }

        if (!tryOpenSharedFromUrl()) {
            init();
        }
    </script>
    <script>
        function openInstagram(e) {
            e.preventDefault();
            const appUrl = 'instagram://user?username=ailey79h';
            const webUrl = 'https://www.instagram.com/ailey79h';
            window.location.href = appUrl;
            setTimeout(() => {
                window.open(webUrl, '_blank');
            }, 800);
        }
    </script>
